<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To Do List</title>
    <!-- Bootstrap css link -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- External css link -->
     <link rel="stylesheet" href="style.css">

<body class="bg-light">
    
    <div class=" card w-50 bg-primary mx-auto mt-5 shadow-lg	">
        <p class="h3 fw-bold text-light text-center py-2">To-Do List</p>
        <div class="input-group px-5 py-2">
            <input type="text" class="form-control" placeholder="Add a new task" id="Taskinput">
            <button class="btn btn-info text-light" type="button" onclick="AddNewTask()" id="">Add</button>

            
          </div>

          <ul class="list-group px-5 py-2 ul" id="UnoderList">

          </ul>
    </div>





 


    <!-- Bootstrap JavaScript link -->

</html>
